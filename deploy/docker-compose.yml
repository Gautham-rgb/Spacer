# Three containers, one image, each runs a single mode.
# Tokens come from the repo-root `.env` (injected at runtime, never baked in).
#
# Run from this directory (deploy/):
#   docker compose up -d web caddy      # site on :80 (use your Nest domain for HTTPS)
# Or run all three (web + Slack + Discord) behind the proxy.
#
# Build context is the repo root (..) so the Dockerfile can COPY app.py and
# the bundled de421.bsp; the Dockerfile itself lives in this deploy/ folder.

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: spacer-web
    expose:
      - "8080"
    environment:
      - PORT=8080
    env_file:
      - ../.env
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  slack:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: spacer --slack
    env_file:
      - ../.env
    restart: unless-stopped

  discord:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: spacer --discord
    env_file:
      - ../.env
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
