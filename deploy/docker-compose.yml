# Web (Nest target port 80) + Slack + Discord, one image.
# Tokens come from the repo-root `.env` (injected at runtime, never baked in).
#
# Run from this directory (deploy/):
#   docker compose up -d web slack discord     # all services
#   docker compose up -d web                   # website only
#
# Nest notes:
#   - Nest's proxy expects your app to listen on port 80 (see your Nest
#     Domains panel: "Target Port: 80"). We bind the web app to 80 here.
#   - Point your domain at systemic-speed.hackclub.app; Nest terminates HTTPS,
#     so we do NOT run our own Caddy anymore.
#
# Build context is the repo root (..) so the Dockerfile can COPY app.py and
# the bundled de421.bsp; the Dockerfile lives in this deploy/ folder.

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: spacer-web
    ports:
      - "80:80"
    environment:
      - PORT=80
    env_file:
      - ../.env
    restart: unless-stopped

  slack:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: spacer --slack
    env_file:
      - ../.env
    restart: unless-stopped

  discord:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: spacer --discord
    env_file:
      - ../.env
    restart: unless-stopped
